<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pixel Street Racer</title>
<style>
:root{--cyan:#18e6d0;--lime:#35ff88;--gold:#ffd54a;--panel:#10151b;--panel2:#1a222b;--line:#35434e;--txt:#edf5f8;--muted:#91a1ad}*{box-sizing:border-box}body{margin:0;background:#080d12;color:var(--txt);font-family:ui-monospace,Consolas,monospace;image-rendering:pixelated}button,input,select{font:inherit}button{cursor:pointer;color:var(--txt);background:#202b34;border:2px solid #52616c;border-bottom:4px solid #080c10;padding:10px 12px;font-weight:900;text-transform:uppercase}button:active{transform:translateY(2px);border-bottom-width:2px}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1000px;margin:auto;min-height:100dvh;background:linear-gradient(#142332,#080d12 240px);padding:10px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;border:2px solid var(--line);background:#0c1218;padding:10px;box-shadow:0 4px #030609}.brand{font-weight:1000;letter-spacing:1px;font-size:clamp(16px,4vw,26px);color:var(--cyan);text-shadow:2px 2px #006d69}.money{color:var(--gold);font-weight:900}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.nav button{font-size:clamp(10px,2.8vw,14px);padding:11px 2px}.nav button.active{border-color:var(--cyan);color:var(--cyan);background:#123039}.screen{border:3px solid var(--cyan);background:#0e141a;box-shadow:inset 0 0 0 4px #040709;padding:clamp(10px,3vw,20px);min-height:450px}.heading{font-size:clamp(18px,4vw,25px);margin:0 0 12px;color:var(--cyan);text-transform:uppercase}.sub{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:2px solid var(--line);background:var(--panel2);padding:12px;min-width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.big{font-size:clamp(22px,6vw,36px);font-weight:1000}.stat{background:#090e13;border:1px solid #34414b;padding:9px}.bar{height:15px;background:#070b0f;border:2px solid #53616b;margin-top:5px}.bar>i{display:block;height:100%;background:var(--lime)}.carstage{background:linear-gradient(#16456a 0%,#2d6680 45%,#386b32 46%,#1c3b23 65%,#2b3038 66%,#11171d 100%);border:2px solid #4e6978;position:relative;overflow:hidden;min-height:190px;display:flex;align-items:center;justify-content:center}.carstage:after{content:'';position:absolute;bottom:24px;width:120%;height:3px;background:#eee;opacity:.7}.carstage canvas{width:100%;height:190px;display:block}.carinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.pill{border:1px solid #53616b;padding:5px 8px;color:var(--gold);font-size:12px}.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.part{border:2px solid #33434d;background:#151e25;padding:10px}.part h3{margin:0 0 7px;font-size:14px}.part p{color:var(--muted);font-size:11px;min-height:28px}.part button{width:100%;font-size:11px}.profile{display:grid;grid-template-columns:100px 1fr;gap:12px}.avatar{background:linear-gradient(#2458ff,#1512a2);height:110px;border:3px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:58px}.field{width:100%;background:#060a0e;border:2px solid #384650;color:white;padding:10px;margin:6px 0}.notice{margin:8px 0;padding:10px;border:1px solid #53616b;background:#0a1015;color:var(--gold);font-size:12px}.racehud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.racehud .stat{text-align:center}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.controls button{min-height:62px}.primary{background:#087c73;border-color:var(--cyan)}.gold{color:var(--gold)}.small{font-size:11px}.footer{text-align:center;color:#667782;font-size:10px;padding:12px}@media(min-width:650px){.nav{grid-template-columns:repeat(7,1fr)}.parts{grid-template-columns:repeat(3,minmax(0,1fr))}.screen{min-height:540px}.profile{grid-template-columns:150px 1fr}.avatar{height:150px;font-size:76px}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">▰ PIXEL STREET RACER</div><div class="sub">BUILD • TUNE • RACE</div></div><div style="text-align:right"><div class="money" id="money">$2,500</div><div class="sub" id="level">LV 1 • STREET</div></div></header>
<nav class="nav" id="nav"><button data-page="garage" class="active">🚘 Garage</button><button data-page="race">🏁 Race</button><button data-page="shop">🔧 Parts</button><button data-page="dealer">🚗 Dealer</button><button data-page="dyno">📈 Dyno</button><button data-page="profile">👤 Profile</button><button data-page="settings">⚙ Settings</button></nav>
<main class="screen" id="screen"></main><div class="footer">ORIGINAL FAN-MADE PIXEL RACING GAME • PROGRESS SAVES ON THIS DEVICE</div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const defaults={name:'ABENI X2711',money:2500,xp:0,level:1,races:0,wins:0,best:0,car:0,owned:[0],paint:0,engine:0,turbo:0,ecu:0,tires:0,nitro:0,gearbox:0,exhaust:0,points:0,volume:70};let d;try{d={...defaults,...JSON.parse(localStorage.getItem('psr-save')||'{}')}}catch{d={...defaults}};if(!Array.isArray(d.owned))d.owned=[0];let page='garage',race=null,timer=null;const cars=[{name:'Street Hatch',price:0,power:125,weight:980,top:175,color:'#e84b35',shape:0},{name:'Turbo Coupe',price:4200,power:210,weight:1120,top:220,color:'#248ce5',shape:1},{name:'V8 Muscle',price:9500,power:350,weight:1480,top:245,color:'#e7a82f',shape:2},{name:'Night Runner GT',price:18000,power:430,weight:1370,top:285,color:'#b85ae8',shape:3},{name:'Rally Compact',price:12500,power:290,weight:1060,top:235,color:'#43c982',shape:4}];const paints=['#e84b35','#248ce5','#e7a82f','#43c982','#b85ae8','#f2f2ee','#111820','#ff7b20'];const prices={engine:650,turbo:1200,ecu:800,tires:450,nitro:700,gearbox:900,exhaust:500};const labels={engine:'Engine Kit',turbo:'Turbocharger',ecu:'ECU Tune',tires:'Race Tires',nitro:'Nitro System',gearbox:'Gearbox',exhaust:'Performance Exhaust'};function save(){try{localStorage.setItem('psr-save',JSON.stringify(d))}catch{}$('#money').textContent='$'+d.money.toLocaleString();$('#level').textContent=`LV ${d.level} • ${d.wins>=5?'STREET PRO':'STREET'}`}function car(){return cars[d.car]||cars[0]}function upgradedPower(){return car().power+d.engine*18+d.turbo*38+d.ecu*15+d.exhaust*8}function notify(t){const n=$('#notice');if(n){n.textContent=t;n.hidden=false;setTimeout(()=>{if(n)n.hidden=true},2200)}}function shell(title,body){$('#screen').innerHTML=`<h1 class="heading">${title}</h1>${body}<div class="notice" id="notice" hidden></div>`}function drawCar(canvas,idx=d.car,color=d.paint){if(!canvas)return;const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#ffffff22';for(let i=0;i<8;i++)ctx.fillRect(i*70+12,25+(i%3)*13,24,3);ctx.fillStyle='#151d25';ctx.fillRect(0,h-31,w,31);ctx.fillStyle='#dce5e8';for(let x=0;x<w;x+=70)ctx.fillRect(x+10,h-16,30,3);let c=cars[idx]||cars[0],body=paints[color%paints.length];let x=w*.2,y=h*.53,s=Math.min(w/340,1.15);ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0008';ctx.fillRect(8,43,220,13);ctx.fillStyle='#090b0d';ctx.fillRect(18,19,205,34);ctx.fillRect(65,2,104,25);ctx.fillStyle=body;ctx.fillRect(13,17,213,27);ctx.fillRect(59,0,113,25);ctx.fillStyle='#182e40';ctx.fillRect(69,4,40,17);ctx.fillRect(116,4,47,17);ctx.fillStyle='#a9eaff';ctx.fillRect(72,5,33,13);ctx.fillRect(119,5,39,13);ctx.fillStyle='#ffed9c';ctx.fillRect(214,26,10,8);ctx.fillStyle='#ff3b3b';ctx.fillRect(13,27,7,8);ctx.fillStyle='#050608';ctx.fillRect(39,34,35,26);ctx.fillRect(177,34,35,26);ctx.fillStyle='#929da6';ctx.fillRect(48,40,16,14);ctx.fillRect(186,40,16,14);ctx.fillStyle='#222';ctx.fillRect(51,43,10,7);ctx.fillRect(189,43,10,7);if(d.turbo||d.nitro){ctx.fillStyle='#7eeaff';ctx.fillRect(4,35,9,5)}if(d.exhaust){ctx.fillStyle='#a7b1b9';ctx.fillRect(6,43,8,5)}ctx.restore();ctx.fillStyle='#e8f3f7';ctx.font='bold 12px monospace';ctx.fillText(c.name.toUpperCase(),10,17)}function canvasMarkup(){return '<div class="carstage"><canvas id="carCanvas" width="420" height="190"></canvas></div>'}function garage(){shell('Your Garage',`${canvasMarkup()}<div class="carinfo"><div><div class="big">${car().name}</div><div class="sub">${car().power} HP STOCK • ${car().weight} KG</div></div><div class="pill">${d.owned.includes(d.car)?'OWNED':'LOCKED'}</div></div><div class="grid2"><div class="stat"><div class="sub">ENGINE POWER</div><div class="big">${upgradedPower()} <span class="small">HP</span></div></div><div class="stat"><div class="sub">TOP SPEED</div><div class="big">${Math.min(340,car().top+d.turbo*7+d.ecu*4)} <span class="small">KM/H</span></div></div></div><div class="row" style="margin-top:12px"><button id="prev">◀ PREV CAR</button><button id="paint">🎨 PAINT</button><button id="next">NEXT ▶</button></div><div class="grid2" style="margin-top:10px"><button class="primary" id="raceNow">🏁 RACE NOW</button><button id="toParts">🔧 UPGRADE CAR</button></div><p class="sub">Choose a car, change its paint, install performance parts, then race to earn cash and XP.</p>`);drawCar($('#carCanvas'));$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);$('#paint').onclick=()=>{d.paint=(d.paint+1)%paints.length;save();garage()};$('#raceNow').onclick=()=>show('race');$('#toParts').onclick=()=>show('shop')}
function cycle(dir){let n=d.car;for(let i=0;i<cars.length;i++){n=(n+dir+cars.length)%cars.length;if(d.owned.includes(n))break}d.car=n;save();garage()}
function racePage(){if(!d.owned.includes(d.car)){shell('Race',`<p>You need to own this car before racing.</p><button id="dealerGo">GO TO DEALER</button>`);$('#dealerGo').onclick=()=>show('dealer');return}shell('Drag Race',`${canvasMarkup()}<div class="racehud"><div class="stat"><div class="sub">DISTANCE</div><div class="big" id="dist">0 m</div></div><div class="stat"><div class="sub">SPEED</div><div class="big" id="speed">0</div><div class="sub">KM/H</div></div><div class="stat"><div class="sub">GEAR</div><div class="big" id="gear">N</div></div></div><div class="bar"><i id="progress" style="width:0%"></i></div><p class="sub" id="raceText">Ready for a 402-meter drag race. Hold GAS, shift at the right time, and use nitro.</p><div class="controls" style="margin-top:12px"><button class="primary" id="gas">⬆ GAS</button><button id="shift">⚙ SHIFT</button><button id="nitro">🚀 NITRO</button></div><div class="row" style="margin-top:10px"><button id="startRace" class="primary">START RACE</button><button id="backGarage">GARAGE</button></div>`);drawCar($('#carCanvas'));let running=false,dist=0,speed=0,gear=1,rpm=1500,nit=d.nitro>0,pressed=false,frame=null,last=0;const text=$('#raceText');function update(){if(!running)return;const now=performance.now(),dt=Math.min(.06,(now-last)/1000||.016);last=now;if(pressed){rpm+=5000*dt;if(rpm>7800){rpm=7800;speed=Math.max(0,speed-8*dt)}else speed=Math.min(car().top+d.turbo*7,speed+(upgradedPower()/car().weight)*18*dt*(1+gear*.12)*(nit?1.7:1));dist+=speed/3.6*dt}else{rpm=Math.max(1200,rpm-2000*dt);speed=Math.max(0,speed-18*dt)}if(nit){nit=false;text.textContent='NITRO BOOST USED!';speed=Math.min(340,speed+15)}$('#dist').textContent=Math.min(402,Math.floor(dist))+' m';$('#speed').textContent=Math.floor(speed);$('#gear').textContent=gear;$('#progress').style.width=Math.min(100,dist/402*100)+'%';const cv=$('#carCanvas');if(cv){drawCar(cv);const c=cv.getContext('2d');c.fillStyle='#fff';c.font='bold 12px monospace';c.fillText('RPM '+Math.floor(rpm),10,178)}if(dist>=402){running=false;pressed=false;const won=speed>0;d.races++;d.wins++;d.money+=350+Math.floor(upgradedPower()/2);d.xp+=120;d.level=Math.max(d.level,1+Math.floor(d.xp/500));d.points+=2;d.best=d.best?Math.min(d.best,dist/speed*3.6):dist/speed*3.6;save();text.textContent='🏆 FINISH! You earned cash, XP and 2 stat points.';$('#startRace').textContent='RACE AGAIN';$('#startRace').disabled=false;return}frame=requestAnimationFrame(update)}$('#startRace').onclick=()=>{if(running)return;dist=0;speed=0;gear=1;rpm=1500;nit=d.nitro>0;running=true;last=performance.now();pressed=false;$('#startRace').disabled=true;text.textContent='GO! Hold GAS and shift before the RPM hits red.';update()};const gas=$('#gas');gas.onpointerdown=e=>{e.preventDefault();pressed=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>gas.addEventListener(ev,()=>pressed=false));$('#shift').onclick=()=>{if(!running)return;if(rpm>4300&&rpm<6900){gear=Math.min(6,gear+1);speed+=5;rpm*=.62;text.textContent='PERFECT SHIFT!'}else{gear=Math.min(6,gear+1);rpm*=.72;text.textContent='SHIFTED — watch the RPM!'}};$('#nitro').onclick=()=>{if(!running||!nit)return;nit=false;speed+=30;text.textContent='NITRO BOOST!'};$('#backGarage').onclick=()=>{running=false;cancelAnimationFrame(frame);show('garage')}}
function shop(){shell('Performance Parts',`<div class="grid2"><div class="stat"><div class="sub">WALLET</div><div class="big money">$${d.money.toLocaleString()}</div></div><div class="stat"><div class="sub">CURRENT POWER</div><div class="big">${upgradedPower()} HP</div></div></div><div class="parts" style="margin-top:12px">${Object.keys(labels).map(k=>`<div class="part"><h3>${labels[k]}</h3><div class="gold">LEVEL ${d[k]||0}</div><p>${({engine:'Improves engine output and acceleration.',turbo:'Adds a strong boost to power and top speed.',ecu:'Fine-tunes engine mapping for better performance.',tires:'Improves launch grip off the line.',nitro:'Unlocks one nitro boost during each race.',gearbox:'Helps acceleration through the gears.',exhaust:'Small power gain with a performance sound.'})[k]}</p><button data-buy="${k}" ${d.money<prices[k]*(1+(d[k]||0))?'disabled':''}>UPGRADE $${(prices[k]*(1+(d[k]||0))).toLocaleString()}</button></div>`).join('')}</div>`);$('#screen').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy,cost=prices[k]*(1+(d[k]||0));if(d.money<cost)return;d.money-=cost;d[k]=(d[k]||0)+1;save();shop();notify(labels[k]+' installed!')})}
function dealer(){shell('Car Dealership',`<p class="sub">Buy a new ride. Each car has a different power, weight and top speed.</p><div class="parts">${cars.map((c,i)=>`<div class="part"><div class="carstage" style="min-height:110px"><canvas data-car="${i}" width="320" height="120" style="width:100%;height:110px"></canvas></div><h3>${c.name}</h3><p>${c.power} HP • ${c.weight} KG • ${c.top} KM/H</p><div class="row"><span class="gold">$${c.price.toLocaleString()}</span><span class="small">${d.owned.includes(i)?'OWNED':''}</span></div><button data-carbuy="${i}" ${d.owned.includes(i)||d.money<c.price?'disabled':''}>${d.owned.includes(i)?'OWNED':'BUY CAR'}</button><button data-select="${i}" style="margin-top:6px;width:100%" ${!d.owned.includes(i)?'disabled':''}>SELECT</button></div>`).join('')}</div>`);$('#screen').querySelectorAll('[data-car]').forEach(cv=>drawCar(cv,Number(cv.dataset.car)));$('#screen').querySelectorAll('[data-carbuy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.carbuy;if(d.money<cars[i].price)return;d.money-=cars[i].price;d.owned.push(i);d.car=i;save();dealer();notify('New car purchased!')});$('#screen').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{d.car=+b.dataset.select;save();show('garage')})}
function dyno(){const p=upgradedPower(),top=Math.min(340,car().top+d.turbo*7+d.ecu*4),acc=(car().weight/p*2.6).toFixed(2);shell('Dyno Test',`${canvasMarkup()}<div class="grid2" style="margin-top:12px"><div class="stat"><div class="sub">ESTIMATED POWER</div><div class="big">${p} HP</div><div class="bar"><i style="width:${Math.min(100,p/500*100)}%"></i></div></div><div class="stat"><div class="sub">TOP SPEED</div><div class="big">${top} KM/H</div><div class="bar"><i style="width:${top/340*100}%"></i></div></div><div class="stat"><div class="sub">WEIGHT</div><div class="big">${car().weight} KG</div></div><div class="stat"><div class="sub">POWER / WEIGHT</div><div class="big">${(p/car().weight*1000).toFixed(0)}</div><div class="sub">HP / TONNE</div></div></div><button id="test" class="primary" style="width:100%;margin-top:12px">RUN DYNO PULL</button><p id="dynoResult" class="notice">Run a test to see your current tune report.</p><button id="back" style="width:100%">BACK TO GARAGE</button>`);drawCar($('#carCanvas'));$('#test').onclick=()=>{$('#dynoResult').textContent=`DYNO COMPLETE: ${p} HP at ${5200+d.engine*150+d.turbo*250} RPM. Power-to-weight ${((p/car().weight)*1000).toFixed(0)} HP/tonne. ${p>300?'HIGH PERFORMANCE BUILD':'Good street setup — upgrade parts for more power.'}`;d.xp+=10;save()};$('#back').onclick=()=>show('garage')}
function profile(){shell('Player Profile',`<div class="profile"><div><div class="avatar">👤</div><div class="pill" style="display:block;text-align:center;margin-top:6px">LV ${d.level}</div></div><div><label class="sub">PLAYER NAME</label><input class="field" id="playerName" maxlength="20" value="${esc(d.name)}"><div class="big">${esc(d.name)}</div><div class="sub">RANK: ${d.wins>=20?'DRAG LEGEND':d.wins>=5?'STREET PRO':'ROOKIE'}</div><div class="sub" style="margin-top:10px">XP ${d.xp} / ${d.level*500}</div><div class="bar"><i style="width:${Math.min(100,d.xp/(d.level*500)*100)}%"></i></div></div></div><div class="grid2" style="margin-top:14px"><div class="stat"><div class="sub">RACES</div><div class="big">${d.races}</div></div><div class="stat"><div class="sub">WINS</div><div class="big">${d.wins}</div></div><div class="stat"><div class="sub">STAT POINTS</div><div class="big">${d.points}</div></div><div class="stat"><div class="sub">CARS OWNED</div><div class="big">${d.owned.length}</div></div></div><button id="saveName" class="primary" style="width:100%;margin-top:12px">SAVE PROFILE</button>`);$('#saveName').onclick=()=>{d.name=$('#playerName').value.trim()||'STREET RACER';save();profile();notify('Profile saved!')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function settings(){shell('Settings',`<div class="card"><h3>GAME OPTIONS</h3><label class="sub">Sound volume (visual setting)</label><input id="volume" type="range" min="0" max="100" value="${d.volume}" style="width:100%"><div class="row"><span>Volume</span><strong id="volVal">${d.volume}%</strong></div></div><div class="card" style="margin-top:10px"><h3>LOCAL SAVE</h3><p class="sub">Your cash, cars and upgrades are saved in this browser on this device.</p><button id="export" style="width:100%">EXPORT SAVE CODE</button><textarea class="field" id="saveCode" rows="3" placeholder="Save code appears here"></textarea><button id="import" style="width:100%">IMPORT SAVE CODE</button></div><button id="reset" style="width:100%;margin-top:12px;border-color:#e84b35">RESET ALL PROGRESS</button>`);$('#volume').oninput=()=>{$('#volVal').textContent=$('#volume').value+'%';d.volume=+$('#volume').value;save()};$('#export').onclick=()=>{$('#saveCode').value=btoa(unescape(encodeURIComponent(JSON.stringify(d))))};$('#import').onclick=()=>{try{const x=JSON.parse(decodeURIComponent(escape(atob($('#saveCode').value.trim()))));d={...defaults,...x};save();show('garage');notify('Save imported!')}catch{notify('Invalid save code')}};$('#reset').onclick=()=>{if(confirm('Delete all progress and restart?')){d={...defaults,owned:[0]};save();show('garage')}}}
function show(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));save();({garage,race,shop,dealer,dyno,profile,settings}[p]||garage)()}$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};save();show('garage');
})();
</script></body></html>
